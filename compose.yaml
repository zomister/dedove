services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: dedove
      MYSQL_USER: dedove
      MYSQL_PASSWORD: dedove
      MYSQL_ROOT_PASSWORD: dedove
    volumes:
      - dedove-db:/var/lib/mysql

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - dedove-node-modules:/app/node_modules
    environment:
      DB_HOST: mysql
      DB_USER: dedove
      DB_PASSWORD: dedove
      DB_NAME: dedove
      API_KEY: ${API_KEY:-}
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '127.0.0.1:5173:5173'
    command: sh -c 'npm ci && (npm run dev:server & npm run dev -- --host 0.0.0.0)'
    depends_on:
      - mysql

volumes:
  dedove-db:
  dedove-node-modules:
